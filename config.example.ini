; skok default configuration. Copied to %LOCALAPPDATA%\skok\config.ini on first launch.
; Reload the script (tray menu) after editing. Save as UTF-8 or UTF-16.

[settings]
; Path to VirtualDesktopAccessor.dll, relative to skok.ahk unless absolute; defaults to the file next to skok.ahk.
; skok does not start without it. Get it from https://github.com/Ciantic/VirtualDesktopAccessor/releases
virtual_desktop_accessor=
; Key held as the modifier for all hotkeys below (e.g. CapsLock, F24, or a modifier such as Alt).
; A non-modifier key loses its normal function while skok runs.
; Win overrides Windows shortcuts (Win+V, Win+H, ...) and Win+L cannot be bound.
super_key=CapsLock
; super + this key toggles between the current and previous virtual desktop.
previous_desktop_hotkey=Tab
; super + this key toggles between the current and previously focused window, switching desktops if needed.
previous_window_hotkey=Space
; super + this key cycles forward through windows on the current desktop.
cycle_windows_hotkey=j
; super + this key cycles backward through the same windows.
reverse_cycle_windows_hotkey=k
; super + this key pins the active window to all desktops, or unpins it.
pin_window_hotkey=p
; super + this key closes the active window (AHK syntax: + is Shift, so Shift+Backspace).
close_window_hotkey=+Backspace
; super + this key opens window search across all desktops, or cancels like Esc if already open (Enter accepts).
search_windows_hotkey=s
; Show a live thumbnail of the selected search result in place, without focusing it (0, false, no or off disables it).
preview_search_selection=1
; Modifier added to a desktop's hotkey (with super) to move the active window to that desktop and follow it:
; a key name like super_key (Shift, Ctrl, ...) or an AHK prefix (+, ^, ...). Must differ from super_key;
; defaults to Alt, or Shift if super_key is Alt.
move_window_modifier=Alt
; Show a temporary, click-through list of window titles while cycling (0, false, no or off disables it).
show_cycle_titles=1
; Display for search and the cycle strip: primary (main display, default) or active.
; active uses the foreground window's display when search/cycling starts; placement stays fixed.
overlay_display=primary
; Outline the selected window in the Windows accent color while cycling or previewing search results.
highlight_selection=1
; Theme for the cycle strip and window search: system, light or dark. Always uses the Windows accent color.
theme=system

; One section per virtual desktop: [desktop.<name>]. skok finds desktops by name, so shortcuts survive
; reordering in Task View. At startup, a section without a matching desktop names the desktop at its
; position in this file (first section = desktop 1), or creates one. Duplicate hotkeys are reported as errors.
;   hotkey  - key pressed with super (AHK syntax, e.g. 1, b, +b for shift+b); must not include move_window_modifier
;             If already on that desktop, cycle its windows; release super to focus the selection.
;
; [send.<name>] sections send keystrokes instead, e.g. another app's global shortcut:
;   hotkey  - key pressed with super
;   keys    - AHK Send syntax, e.g. #!{Space} for Win+Alt+Space (PowerToys Command Palette)

[desktop.web]
hotkey=1

[desktop.code]
hotkey=2

[desktop.terminal]
hotkey=3