; skok default configuration. Copied to %LOCALAPPDATA%\skok\config.ini on first launch.
; Reload the script (tray menu) after editing. Save as UTF-8 or UTF-16.

[settings]
; Key held as the modifier for all hotkeys below (e.g. CapsLock, F24, or a modifier such as Alt).
; A non-modifier key loses its normal function while skok runs.
super_key=CapsLock
; super + this key toggles between the current and previously focused window.
previous_window_hotkey=Tab
; super + this key cycles forward through windows of the active app.
cycle_app_windows_hotkey=j
; super + this key cycles backward through windows of the active app.
reverse_cycle_app_windows_hotkey=k
; super + this key cycles forward through windows no [app.*] section matches.
cycle_unconfigured_hotkey=l
; super + this key cycles backward through the same list.
reverse_cycle_unconfigured_hotkey=h
; super + this key closes the active window (CapsLock + Backspace by default).
close_window_hotkey=Backspace
; super + this key opens a fuzzy search over all open windows (Enter focuses the pick, Esc cancels).
search_windows_hotkey=/
; Modifier added to an app's hotkey (with super) to launch a new instance:
; a key name like super_key (Shift, Ctrl, ...) or an AHK prefix (+, ^, ...). Must differ from super_key.
new_instance_modifier=Shift
; Show a temporary, click-through list of window titles while cycling (0, false, no or off disables it).
show_cycle_titles=1

; One section per app: [app.<name>]. Each section registers its own hotkeys;
; section order does not resolve overlapping window matches. Duplicate hotkeys
; are reported as config errors.
;   hotkey  - key pressed with super (AHK syntax, e.g. f, +f for shift+f)
;   match   - AHK WinTitle used to find running windows (e.g. ahk_exe Code.exe)
;   run     - command/path used to launch the app when no window matches; quotes are kept,
;             so quote paths containing spaces
;   new_instance_run - optional command for super + new_instance_modifier + hotkey; defaults to run
;   run_dir - optional working directory for run and new_instance_run

[app.browser]
hotkey=b
match=ahk_exe msedge.exe
run=msedge
new_instance_run=msedge --new-window

[app.vscode]
hotkey=v
match=ahk_exe Code.exe
run=code
new_instance_run=code --new-window

[app.terminal]
hotkey=Enter
match=ahk_exe WindowsTerminal.exe
run=wt
new_instance_run=wt -w new